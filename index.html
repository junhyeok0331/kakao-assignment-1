<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니멀 Todo 앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <div class="weekly-section">
            <div class="weekly-header">
                <button id="prev-week-btn">&lt;</button>
                <h2 id="current-month-display">2026년 06월</h2>
                <button id="next-week-btn">&gt;</button>
            </div>
            <div id="weekly-calendar" class="weekly-calendar">
                </div>
        </div>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." maxlength="50">
            <button id="add-btn">추가</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행 중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <ul id="todo-list">
            </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
